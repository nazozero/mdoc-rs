[package]
name = "nazo-mdoc"
version = "0.4.0"
authors = ["NazoZero", "Kushal Das"]
edition = "2024"
rust-version = "1.100"
description = "ISO mdoc issuance and authenticated reader protocols"
repository = "https://github.com/nazozero/nazo-mdoc"
license = "BSD-2-Clause"
readme = "README.md"
exclude = ["benchmarks", "fuzz", ".github"]
keywords = ["mdoc", "cose", "openid4vp", "cbor"]
categories = ["cryptography", "authentication"]

[features]
default = []
issue = ["dep:getrandom"]
debug = []
wasm-js = ["getrandom?/wasm_js"]
certificate-profile = ["dep:sha1", "dep:x509-parser"]
reader-session = ["dep:aes-gcm", "dep:zeroize", "hmac/zeroize", "sha2/zeroize"]
reader-crypto = ["dep:bp256", "dep:bp384", "dep:ecdsa", "dep:crrl"]
aws-lc = ["dep:aws-lc-rs"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"], optional = true }
bp256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha256"], optional = true }
bp384 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdsa", "sha384"], optional = true }
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"], optional = true }
crrl = { version = "0.9.0", default-features = false, features = ["ed448"], optional = true }
ciborium = "0.2.2"
coset = "0.4.2"
const-oid = { version = "0.10.3", features = ["db"] }
der = { version = "0.8.3", features = ["alloc"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = { version = "0.4.3", optional = true }
hkdf = "0.13.0"
hmac = "0.13.0"
iri-string = { version = "0.7.14", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sha1 = { version = "0.11.0", optional = true }
signature = "3.0.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["std", "pem"] }
x509-parser = { version = "0.18.1", default-features = false, optional = true }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["non-fips"], optional = true }

[dev-dependencies]
hex = "0.4.3"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.23.0"
p256 = { version = "0.14.0", default-features = false, features = ["pkcs8", "ecdh"] }
x509-cert = { version = "0.3.0", default-features = false, features = ["builder"] }
