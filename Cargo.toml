[package]
name = "nazo-mdoc"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "Bounded ISO mdoc protocol core with external signing and explicit trust boundaries"
repository = "https://github.com/nazozero/mdoc-rs"
license = "BSD-2-Clause"
readme = "README.md"
exclude = ["benchmarks", "fuzz", ".github"]
keywords = ["mdoc", "cose", "openid4vp", "cbor"]
categories = ["cryptography", "authentication"]

[features]
default = []
issue = ["dep:getrandom"]
debug = []
wasm-js = ["getrandom?/wasm_js"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
ciborium = "0.2"
coset = "0.4.2"
const-oid = { version = "0.9", features = ["db"] }
der = { version = "0.7", features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = { version = "0.4", optional = true }
hkdf = "0.12"
hmac = "0.12"
iri-string = { version = "0.7", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
p521 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
signature = "3"
thiserror = "2"
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
proptest = "1"
