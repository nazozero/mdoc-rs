[package]
name = "mdoc-candidate-minimal-consumer"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "BSD-2-Clause"

[workspace]

[features]
default = []
issue = ["mdoc/issue"]
debug = ["mdoc/debug"]
wasm-js = ["mdoc/wasm-js"]

[dependencies]
mdoc = { package = "nazo-mdoc", path = "../../../..", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
