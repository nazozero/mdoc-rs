name: protocol-core
on:
  push:
    branches: [main, nazoauth/patched-rustcrypto, refactor/nazo-mdoc-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: protocol-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --locked --no-default-features
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features issue
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip2
      - run: cargo check --locked --no-default-features --target wasm32-unknown-unknown
      - run: cargo check --locked --no-default-features --features issue,wasm-js --target wasm32-unknown-unknown
      - run: cargo check --locked --no-default-features --features issue --target wasm32-wasip2
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71
      - run: cargo install cargo-audit --version 0.23.0 --locked --no-default-features
      - run: cargo audit --deny warnings
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: python3 fuzz/seed.py
      - run: cargo +nightly fuzz run decode -- -max_total_time=120 -timeout=5 -max_len=65536 -rss_limit_mb=2048
