name: Temporary refresh native crypto lockfile
on:
  push:
    branches: [feat/iso-reader-issue-3]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff
        with:
          components: rustfmt
      - run: cargo fetch
      - run: cargo fetch --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --all
      - name: Commit lockfiles and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock fuzz/Cargo.lock src tests
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve AWS-LC native dependencies"
            git push
          fi
