[package]
name = "nazo-mdoc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
nazo-mdoc = { path = "..", features = ["certificate-profile", "reader-session"] }
x509-parser = { version = "0.18.1", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "certificate"
path = "fuzz_targets/certificate.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "reader_session"
path = "fuzz_targets/reader_session.rs"
test = false
doc = false
bench = false
